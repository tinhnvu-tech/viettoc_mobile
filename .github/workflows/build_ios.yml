name: Build iOS IPA (Native)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build Native iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: 🔍 Flutter Doctor & Dependencies
        run: |
          flutter doctor -v
          flutter pub get

      - name: 🧪 Run Unit & Widget Tests
        run: |
          flutter test

      - name: 🍎 Build iOS (Release No-Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: 📦 Package into Native IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r -q viettoc_mobile_release.ipa Payload
          ls -lh viettoc_mobile_release.ipa

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viettoc_mobile_ios_ipa
          path: build/ios/iphoneos/viettoc_mobile_release.ipa
          retention-days: 30
