<!DOCTYPE html>
<html>
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Ứng dụng thiện nguyện Hội Việt Tộc - Đồng hành cùng hơn 100 buôn làng Tây Nguyên">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hội Việt Tộc">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hội Việt Tộc - Nhịp Cầu Yêu Thương</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F7F5F0;
      touch-action: pan-y;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #F7F5F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.35s ease-out;
    }
    .spinner {
      border: 3.5px solid #EBE5D9;
      border-top: 3.5px solid #B84A27;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div style="font-weight: 700; font-size: 17px; color: #234234; letter-spacing: 0.3px;">HỘI VIỆT TỘC</div>
    <div style="font-size: 13px; color: #5C524C; margin-top: 5px;">Đang tải ứng dụng...</div>
  </div>

  <!-- iOS PWA Install Prompt Banner -->
  <div id="ios-install-banner" style="display:none; position:fixed; bottom:20px; left:16px; right:16px; background:#234234; color:#FFFFFF; padding:12px 14px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.35); z-index:9000; font-family:-apple-system,BlinkMacSystemFont,sans-serif; border:1px solid #C98A32; animation: slideUp 0.4s ease-out;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
      <div style="display:flex; align-items:center; gap:10px; flex:1;">
        <img src="apple-touch-icon.png" style="width:38px; height:38px; border-radius:8px; flex-shrink:0; border:1px solid #EBE5D9;" alt="Logo">
        <div style="line-height:1.35;">
          <div style="font-weight:700; font-size:13px; color:#FFFFFF;">Cài Đặt Ứng Dụng Vào iPhone</div>
          <div style="font-size:11px; color:#EBE5D9; margin-top:2px;">Bấm nút <span style="font-weight:bold; color:#E2A028;">[ ⬆️ Chia sẻ ]</span> rồi chọn <span style="font-weight:bold; color:#E2A028;">[ Thêm vào MH chính ]</span></div>
        </div>
      </div>
      <button onclick="document.getElementById('ios-install-banner').style.display='none'" style="background:transparent; border:none; color:#EBE5D9; font-size:20px; line-height:1; cursor:pointer; padding:4px 6px;">✕</button>
    </div>
  </div>

  <script>
    function removeLoader() {
      var el = document.getElementById('loading-indicator');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() {
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, 350);
      }
    }

    // Gỡ loader khi Flutter hiển thị khung hình đầu tiên
    window.addEventListener('flutter-first-frame', removeLoader);

    // Observer quan sát DOM khi Flutter chèn phần tử hiển thị
    var observer = new MutationObserver(function(mutations, obs) {
      var flt = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view');
      if (flt) {
        removeLoader();
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Hạn định tối đa: Tự động tắt sau 3 giây tuyệt đối không để người dùng chờ
    setTimeout(removeLoader, 3000);

    // Hiển thị banner hướng dẫn cài đặt nếu mở trên Safari iOS (chưa lưu ra Home Screen)
    var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (isIos && !isStandalone) {
      setTimeout(function() {
        var banner = document.getElementById('ios-install-banner');
        if (banner) banner.style.display = 'block';
      }, 2000);
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
